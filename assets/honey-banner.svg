<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="t d">
<title id="t">Honey — I shrunk the AI</title>
<desc id="d">Honey cuts output tokens 40%, lines of code 52% and cost 31% versus no skill, with 100% of tests passing. Claude Opus 5.5, 23 tasks, 3 runs, paired medians.</desc>
<style>
text{font-family:Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#f0f3ee}
.lab{font-size:13px;font-weight:600;letter-spacing:.06em;fill:#aab0a6}
.dl{font-size:40px;font-weight:650;letter-spacing:-.03em;fill:#3bc971;animation:dl 6s ease-out infinite both}
.k{fill:#3bc971;stroke:#3bc971}
.c{fill:transparent;stroke:#5b7565;animation:cut 6s ease-in-out infinite both}
.chip{fill:none;stroke:#2c3a30}
.ct{font-size:14px;font-weight:600}
.logo{transform-box:fill-box;transform-origin:center;animation:spin 6s ease-in-out infinite}
@keyframes cut{0%,12%{fill:#3bc971;stroke:#3bc971}30%,88%{fill:transparent;stroke:#5b7565}100%{fill:#3bc971;stroke:#3bc971}}
@keyframes dl{0%,22%{opacity:0}34%,88%{opacity:1}100%{opacity:0}}
@keyframes spin{0%,40%{transform:rotate(0)}55%,100%{transform:rotate(60deg)}}
@media (prefers-reduced-motion:reduce){.c,.dl,.logo{animation:none}}
</style>
<defs><polygon id="h" points="12.5,1.5 23.5,7.75 23.5,20.25 12.5,26.5 1.5,20.25 1.5,7.75" stroke-width="1.5"/></defs>
<rect width="1280" height="640" fill="#16241c"/>
<polygon class="logo" points="94,73 107,80.5 107,95.5 94,103 81,95.5 81,80.5" fill="#3bc971"/>
<text x="120" y="95" class="lab">GREENPT · OPEN-SOURCE SKILL</text>
<text x="74" y="232" style="font-size:128px;font-weight:650;letter-spacing:-.045em">Honey</text>
<text x="80" y="292" style="font-size:34px;font-weight:600;letter-spacing:-.02em">I shrunk the AI.</text>
<text x="80" y="346" style="font-size:19px;fill:#ccd2c9">Write less code. Say less about it.</text>
<text x="80" y="374" style="font-size:19px;fill:#ccd2c9">A coding-agent skill that cuts what the model</text>
<text x="80" y="402" style="font-size:19px;fill:#ccd2c9">emits, not what it gets right.</text>
